[project]
name = "ottd-bench"
version = "0.2.0"
description = "Repeatable harness for benchmarking vision LLMs (local and cloud) playing OpenTTD"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27",
    "pillow>=10.1",
    "pyyaml>=6.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ottd-bench = "ottd_bench.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ottd_bench", "ottd_bench.providers"]

[tool.setuptools.package-data]
ottd_bench = ["*.md"]
